# My Jira Board — one-command local deploy.
#
#   docker compose up -d --build                 # board + AI-Intern + AI-Ollama (all three)
#   docker compose up -d --build jira-board      # board only — the AI pair is optional
#   docker compose logs -f                       # watch fetch + server logs
#   docker compose down                          # stop everything
#
# Without the AI pair the board still works: Settings shows "AI intern offline" and PR
# reports stay deterministic. The board's dependency on jira-ai is marked optional, so
# `up jira-board` never pulls the Ollama image.
#
# `restart: unless-stopped` means it comes back automatically whenever Docker starts,
# so once it's up you never have to touch the command line again.
# Published host port is fixed via PORT (default 4321). The desktop launcher and
# start-jira-board.sh always set the same PORT so every redeploy lands on one
# dedicated port — never auto-incremented.
#
# Network exposure: the board is published on 127.0.0.1 only (this machine). To reach
# it from another device set BIND_IP=0.0.0.0 AND list the Host names the server may
# answer to, e.g.   BIND_IP=0.0.0.0 ALLOWED_HOSTS=my-mac.local,192.168.1.20 docker compose up -d
# (the API rejects unknown Host headers so a web page cannot DNS-rebind onto it).
#
# The board image runs as the unprivileged `node` user (uid 1000, HOME=/home/node — see
# docker/Dockerfile). Its bind mounts must be writable by uid 1000: transparent on Docker Desktop
# (macOS/Windows); on a Linux host run  sudo chown -R 1000:1000 ./jira-intern  once.
#
# Docker Desktop stack / Compose project: JIRA-Project
# (Compose requires a lowercase project name, so it is stored as jira-project.)
# Containers: JIRA-Board, AI-Intern, AI-Ollama
# AI-Ollama only runs when Settings → "AI-Ollama container" is on AND jira-intern/models/
# contains a model; the board starts/stops it over the Docker socket (server/ollama.mjs).
name: jira-project
services:
  jira-board:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: jira-board:latest
    container_name: JIRA-Board
    ports:
      # host-ip:host-port:container-port — loopback unless you opt in with BIND_IP.
      - "${BIND_IP:-127.0.0.1}:${PORT:-4321}:4321"
    environment:
      # Inside the container the server listens on all interfaces; BIND_IP above decides
      # what the host publishes.
      - BIND_HOST=0.0.0.0
      - PORT=4321
      - AI_INTERN_URL=http://jira-ai:4322
      # Bare names are pass-throughs: set in your shell → set in the container, otherwise
      # absent (an empty string would mask the value in setup/.env).
      # Extra Host headers the API accepts (comma-separated) when BIND_IP is not loopback.
      - ALLOWED_HOSTS
      # TLS to Jira/Bitbucket is verified by default. Private corporate CA: mount the PEM
      # (volume below) and set JIRA_CA_BUNDLE=/etc/ssl/private-ca.pem. JIRA_INSECURE_TLS=1
      # switches verification off entirely — last resort only.
      - JIRA_CA_BUNDLE
      - JIRA_INSECURE_TLS
      # The board starts/stops AI-Ollama to match the AI settings (server/ollama.mjs).
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_CONTAINER=AI-Ollama
    # The Docker socket is root:<gid> inside the VM; the board runs as `node`, so it joins that
    # group. Docker Desktop: 0. Linux host: DOCKER_GID=$(stat -c %g /var/run/docker.sock).
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      # Docker socket, so the board can start and stop the AI-Ollama container on demand.
      # Remove this line to opt out: Ollama then simply follows compose (always on).
      - /var/run/docker.sock:/var/run/docker.sock
      # API keys: setup/.env, written by the board's API keys dialog — so read-write here.
      # Mount the directory, not the file: saving replaces the file (temp + rename), and a
      # single-file bind would stay pointed at the old inode.
      - ./setup:/app/setup
      # Sparse personal overrides; project defaults live in config/jira-board.config.json.
      - ${HOME:?HOME must be set}/.ai:/home/node/.ai:ro
      - ./config:/app/config:ro
      # Persist fetched data on the host (and reuse your current dump). Remove this
      # line for a fully self-contained, ephemeral container that uses the baked data.
      - ./jira-intern:/app/jira-intern
      # If your Jira uses a private CA, either mount the CA and set
      # JIRA_CA_BUNDLE=/etc/ssl/private-ca.pem, or set JIRA_INSECURE_TLS=1 as a last resort.
      # - ${JIRA_CA_BUNDLE_HOST:-/dev/null}:/etc/ssl/private-ca.pem:ro
    depends_on:
      jira-ai:
        condition: service_started
        required: false # the AI pair is optional (`up jira-board`); the board degrades to "AI offline"
    restart: unless-stopped
    # If auto-refresh / archive logs show "Name or service not known" for
    # your Jira host, Docker's DNS proxy is flapping (common with VPN).
    # Uncomment one of these and recreate the container:
    # dns:
    #   - 8.8.8.8
    #   - 1.1.1.1
    # Alternative to the API keys dialog — pass tokens directly (they win over setup/.env):
    # env_file:
    #   - setup/.env

  ollama:
    image: ollama/ollama:latest
    container_name: AI-Ollama
    volumes:
      # Ollama's whole store lives in the repo's models directory, so a model pulled from
      # Settings and a .gguf you drop there by hand are the same thing to the board's
      # "only run when a model is present" rule. (Migrating from the old named volume:
      # start-jira-board.sh copies it across once when this directory is still empty.)
      - ./jira-intern/models:/root/.ollama
    # unless-stopped: when the board stops this container (local AI off, or no models yet) it
    # stays stopped across Docker restarts until the board starts it again.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 8

  jira-ai:
    build: ./ai-intern
    image: ai-intern:latest
    container_name: AI-Intern
    environment:
      - INTERN_DIR=/app/jira-intern
      - PORT=4322
      - OLLAMA_HOST=http://ollama:11434
      - HOST_OLLAMA_URL=http://host.docker.internal:11434
      # This image runs as root, so its mounts live under /root (unlike the board).
      # Pass-throughs (see jira-board above for what they mean).
      - JIRA_CA_BUNDLE
      - JIRA_INSECURE_TLS
      # Optional scanner / observability endpoints the intern can read; these may instead
      # live in config/jira-board.config.json under endpoints.*.
      - CHECKMARX_BASE_URL
      - CHECKMARX_AUTH_URL
      - DYNATRACE_TENANTS
    volumes:
      - ./jira-intern:/app/jira-intern
      - ${HOME:?HOME must be set}/.ai:/root/.ai:ro
      # API keys (setup/.env), read-only: the worker re-reads it on every cloud call, so a key
      # saved in the board works without a restart. It sits beside /app/jira-intern, as on the host.
      - ./setup:/app/setup:ro
      - ./config:/app/config:ro
      # Model catalogue: edit it, then `docker compose restart jira-ai` — no rebuild.
      - ./ai-intern/models.json:/app/models.json:ro
      # Cursor price table (reference data for the guide and for entries without a price): no rebuild after an edit.
      - ./ai-intern/cursor-prices.json:/app/cursor-prices.json:ro
      # THE cloud model list (models, efforts, what counts as costly): edit it and the worker re-reads it on the
      # next model fetch (within a minute) — no rebuild, no restart.
      - ./ai-intern/cloud-models.json:/app/cloud-models.json:ro
      # Private CA — same as the board (uncomment both or neither).
      # - ${JIRA_CA_BUNDLE_HOST:-/dev/null}:/etc/ssl/private-ca.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        # Ollama defines a healthcheck; a full `up` waits for it. start-jira-board.sh brings this
        # service up with --no-deps when Ollama is not wanted, so the worker just sees it as down.
        condition: service_healthy
        required: false
    restart: unless-stopped
