name: CI

# Validate shell/config, enforce change-with-test and changed-hook policy, run logic/component/
# production contracts, coverage and browser flows, then prove the Node-only Docker bundle stage.
# Reports and failure artifacts are uploaded for review.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Matches the Dockerfile base image (node:26). Vite 8 needs >= 22.12.
          node-version: 26
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Shellcheck (entrypoint, launchers, runner scripts)
        # -S error only: the runners use a few idioms shellcheck flags at warning level on
        # purpose (sourced files, intentional word splitting), so stylistic findings must
        # not turn CI red.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error docker/docker-entrypoint.sh scripts/start-jira-board.sh scripts/open-guide.sh jira-intern/local-runner/*.sh

      - name: Validate project config
        run: npm run config:validate

      - name: Build and test (logic, component, flow, production contract)
        run: npm run build

      - name: Code coverage
        run: npm run test:coverage

      - name: Install browser for UI tests
        run: npx playwright install --with-deps chromium

      - name: Production UI and flow tests
        run: npm run test:e2e:built

      - name: Upload test reports and browser failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results/
            coverage/
          if-no-files-found: warn

      - name: Upload built board
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/index.html
          if-no-files-found: error

      - name: Docker build smoke test
        run: docker build -f docker/Dockerfile -t ci-smoke .
